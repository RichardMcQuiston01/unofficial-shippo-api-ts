name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm (bundled with Node) is what actually runs `npm publish` under
      # `changeset publish` -- registry-url wires NODE_AUTH_TOKEN into
      # .npmrc so that step can authenticate. Provenance itself comes from
      # this job's OIDC id-token (permissions above), not from the token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: format + lint + typecheck + test + build
        run: bun run ci

      # v2 is required for @changesets/cli v3 (this repo's version, see
      # package.json) -- v1 greps publish-script stdout for a "New tag: "
      # line to know what to tag/release, but CLI v3 replaced that with a
      # spinner UI ("Creating git tags..."), so v1 silently skips both the
      # git tag push and the GitHub release even though npm publish (which
      # doesn't depend on that detection) still succeeds. v2 reads a
      # CHANGESETS_OUTPUT file instead, which isn't affected by CLI output
      # formatting.
      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run version
          publish-script: bun run release
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
